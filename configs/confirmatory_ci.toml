schema_version = 1

# Deterministic synthetic fixture for the optional R mixed-effects CI job.
# This configuration exercises the complete artifact and analysis contracts;
# it is not a paper run and its generated values are not scientific evidence.

[run]
name = "confirmatory-ci-synthetic-smoke"
seed = 271828
output_root = "runs"
deterministic = true

[experiment]
kind = "provenance_audit"
domains = ["travel", "writing"]
mechanisms = ["balanced", "restricted", "default", "suggested"]
response_modes = ["controlled_anchor", "naturally_sampled"]
prior_strengths = [0.0, 0.7]
policies = ["balanced"]
updaters = [
  "fitted_action_aware",
  "full_context_blind",
]
users = 8
trajectories_per_cell = 1
turns = 1
bootstrap_replicates = 0

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.80
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 256
fit_steps = 400
learning_rate = 0.04
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[artifacts]
retain_events = true
retain_prompts = false
checksum_manifest = true
