schema_version = 1

[scenarios]
catalog_file = "data/scenarios/scenario-catalog-v1.json"
catalog_sha256 = "96f092856ea17ea3939a769c754f5dd46299efddc6d0304c3adbf16bddbd0286"
conversation_file = "data/scenarios/conversation-templates-v1.json"
selection_policy = "deterministic-stratified-v1"

[population]
susceptibility_policy = "orthogonal-balanced-v2"
theta_policy = "orthogonal-balanced-v2"

# Canonical offline source for the selected Gate 4 evidence collections. This compact
# design preserves both native memory families, both domains, false-seed
# soft-profile-conditioned trajectories, and the complete provider-neutral
# external packet. The later repository-selected automated decoder collection
# routes the declared Claude and Gemini model families through OpenRouter.

[run]
name = "experiment-b-gate4-source-pilot"
seed = 1729
output_root = "runs"
deterministic = true

[experiment]
kind = "closed_loop"
domains = ["travel", "writing"]
mechanisms = ["ranking", "default", "suggestion"]
response_modes = ["naturally_sampled"]
prior_strengths = [0.0]
policies = ["soft_profile_conditioned"]
updaters = [
  "semantic_memory",
  "provenance_linked_memory",
]
users = 20
trajectories_per_cell = 1
turns = 12
bootstrap_replicates = 2000

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.75
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 4096
fit_steps = 1200
learning_rate = 0.025
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[artifacts]
retain_events = true
retain_prompts = true
checksum_manifest = true
