schema_version = 1

[scenarios]
catalog_file = "data/scenarios/scenario-catalog-v1.json"
catalog_sha256 = "67ad79b911a94811638ed320f7ddd1d4e8e8c1767f15419b9499c691badb6b3a"
conversation_file = "data/scenarios/conversation-templates-v1.json"
selection_policy = "deterministic-stratified-v1"

# Canonical baseline-first one-at-a-time robustness design.

[run]
name = "simulator-sensitivity-full"
seed = 1729
output_root = "runs"
deterministic = true

[experiment]
kind = "sensitivity"
domains = ["travel", "writing"]
mechanisms = ["ranking", "default", "suggestion"]
response_modes = ["naturally_sampled"]
prior_strengths = [0.0]
policies = ["balanced", "soft_profile_conditioned"]
updaters = [
  "fitted_action_aware",
  "fitted_action_unaware",
  "full_context_blind",
  "provenance_aware",
]
users = 24
trajectories_per_cell = 4
turns = 1
bootstrap_replicates = 0

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.80
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 2048
fit_steps = 1200
learning_rate = 0.03
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[sensitivity]
# Diagnostic broad-parameter design. The first value on every axis is the
# baseline; each later value is varied separately. Response-model families
# are compared at that same numeric baseline. This design does not estimate
# interactions among sensitivity axes.
design = "one_at_a_time"
decision_noise_values = [1.0, 0.7, 1.3]
presentation_multipliers = [1.0, 0.5, 1.5]
rank_multipliers = [1.0, 0.5, 1.5]
default_multipliers = [1.0, 0.5, 1.5]
suggestion_multipliers = [1.0, 0.5, 1.5]
profile_strength_values = [0.80, 0.65, 0.90]
prior_uncertainty_values = [0.0, 0.40]
trajectory_lengths = [8, 4, 12]
response_model_families = ["random_utility", "rule_based"]
rule_noise_values = [0.15, 0.10, 0.25]
phase_min_selection_cost = 0.0
phase_max_aware_ece = 0.10
phase_min_attribution_cost = 0.0
phase_min_self_confirming_rate = 0.0
phase_min_suggestion_rejection_rate = 0.20

[artifacts]
retain_events = true
retain_prompts = false
checksum_manifest = true
