schema_version = 1

[scenarios]
catalog_file = "data/scenarios/scenario-catalog-v1.json"
catalog_sha256 = "96f092856ea17ea3939a769c754f5dd46299efddc6d0304c3adbf16bddbd0286"
conversation_file = "data/scenarios/conversation-templates-v1.json"
selection_policy = "deterministic-stratified-v1"

[population]
susceptibility_policy = "orthogonal-balanced-v2"
theta_policy = "orthogonal-balanced-v2"

# Matched GPT-5.6 model-variant replication of experiment_a_openai.toml.

[run]
name = "experiment-a-openai-mixed-effects-replication-pilot"
seed = 1729
output_root = "runs"
deterministic = false

[experiment]
kind = "provenance_audit"
domains = ["travel", "writing"]
mechanisms = ["balanced", "restricted", "ranking", "default", "suggested"]
response_modes = ["controlled_anchor"]
prior_strengths = [0.0, 0.7]
policies = ["balanced"]
updaters = [
  "no_update",
  "exact_action_aware",
  "fitted_action_aware",
  "fitted_action_unaware",
  "llm_full_context",
  "provenance_discount",
]
users = 4
trajectories_per_cell = 1
turns = 1
bootstrap_replicates = 0

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.75
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 512
fit_steps = 600
learning_rate = 0.04
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[llm]
mode = "openai"
calibration = "temperature"
calibration_users = 1
model_role = "replication"
model = "gpt-5.6-terra"
reasoning_effort = "medium"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"
allow_custom_base_url = false
timeout_seconds = 180.0
# 480 experiment + 60 calibration + 40 held-out paraphrase calls = 580
# physical attempts; 320 attempts remain as headroom.
max_retries = 0
max_output_tokens = 2048
max_requests = 900
max_total_tokens = 6000000
journal_dir = ""

[artifacts]
retain_events = true
retain_prompts = true
checksum_manifest = true
