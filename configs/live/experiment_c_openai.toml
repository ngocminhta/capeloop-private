schema_version = 1

[scenarios]
catalog_file = "data/scenarios/scenario-catalog-v1.json"
catalog_sha256 = "7b7144b3b3f75ac7284ab6153d1b6ce62cf293aec94004ee2cb3111bcc1f6cf1"
conversation_file = "data/scenarios/conversation-templates-v1.json"
selection_policy = "deterministic-stratified-v1"

[population]
susceptibility_policy = "orthogonal-balanced-v2"
theta_policy = "orthogonal-balanced-v2"

# Canonical ceiling-safe direct-OpenAI Experiment C pilot. One LLM profile writer is compared
# against all structured and native repository systems under both fixed and
# endogenous regimes. Exact preflight: 768 evaluation + 48 calibration calls.

[run]
name = "experiment-c-openai-primary-pilot"
seed = 1729
output_root = "runs"
deterministic = false

[experiment]
kind = "evaluation_validity"
domains = ["travel", "writing"]
mechanisms = ["ranking", "default", "suggestion"]
response_modes = ["naturally_sampled"]
prior_strengths = [0.0]
policies = ["balanced", "fixed_bias", "soft_profile_conditioned"]
updaters = [
  "response_only",
  "full_context_blind",
  "provenance_aware",
  "conservative",
  "episodic_memory",
  "semantic_memory",
  "provenance_linked_memory",
  "llm_full_context",
]
users = 8
trajectories_per_cell = 1
turns = 8
bootstrap_replicates = 2000

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.75
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 4096
fit_steps = 1200
learning_rate = 0.025
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[llm]
mode = "openai"
calibration = "temperature"
calibration_users = 1
model_role = "primary"
model = "gpt-5.6-sol"
reasoning_effort = "medium"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"
allow_custom_base_url = false
timeout_seconds = 180.0
max_retries = 0
max_output_tokens = 2048
max_requests = 900
max_total_tokens = 6000000
journal_dir = ""

[artifacts]
retain_events = true
retain_prompts = true
checksum_manifest = true
