schema_version = 1

# Matched distinct-family replication of experiment_c_openai.toml.

[run]
name = "experiment-c-openrouter-replication-pilot"
seed = 1729
output_root = "runs"
deterministic = false

[experiment]
kind = "evaluation_validity"
domains = ["travel", "writing"]
mechanisms = ["ranking", "default", "suggestion"]
response_modes = ["naturally_sampled"]
prior_strengths = [0.0]
policies = ["balanced", "fixed_bias", "soft_profile_conditioned"]
updaters = [
  "response_only",
  "full_context_blind",
  "provenance_aware",
  "conservative",
  "episodic_memory",
  "semantic_memory",
  "provenance_linked_memory",
  "llm_full_context",
]
users = 8
trajectories_per_cell = 1
turns = 8
bootstrap_replicates = 2000

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.80
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 4096
fit_steps = 1200
learning_rate = 0.025
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[llm]
mode = "openrouter"
calibration = "temperature"
calibration_users = 1
model_role = "replication"
model = "google/gemini-3.6-flash"
# The live transport smoke showed that unconstrained provider reasoning can
# exhaust the output budget before the required JSON object is complete.
reasoning_effort = "minimal"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api"
allow_custom_base_url = false
timeout_seconds = 180.0
max_retries = 0
max_output_tokens = 2048
max_requests = 900
max_total_tokens = 6000000
journal_dir = ""
openrouter_upstream_provider = "google-vertex/global"
openrouter_allow_fallbacks = false
openrouter_require_parameters = true
openrouter_data_collection = "deny"
openrouter_zdr = false
openrouter_http_referer = ""
openrouter_app_title = "CAPE-Loop"

[artifacts]
retain_events = true
retain_prompts = true
checksum_manifest = true
