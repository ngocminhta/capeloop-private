schema_version = 1

# Canonical budget-bounded direct-OpenAI Experiment B pilot. The balanced and soft-profile policy
# arms preserve the selection-versus-attribution decomposition; the two LLM
# arms provide the full-context baseline and provenance-aware H7 mitigation.
# Exact preflight: 768 experiment + 96 calibration = 864 HTTP attempts.

[run]
name = "experiment-b-openai-primary-pilot"
seed = 1729
output_root = "runs"
deterministic = false

[experiment]
kind = "closed_loop"
domains = ["travel", "writing"]
mechanisms = ["ranking", "default", "suggestion"]
response_modes = ["naturally_sampled"]
prior_strengths = [0.0]
policies = ["balanced", "soft_profile_conditioned"]
updaters = [
  "fitted_action_aware",
  "fitted_action_unaware",
  "response_only",
  "full_context_blind",
  "provenance_discount",
  "llm_full_context",
  "llm_provenance_aware",
]
users = 8
trajectories_per_cell = 1
turns = 3
bootstrap_replicates = 2000

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.80
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 4096
fit_steps = 1200
learning_rate = 0.025
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[llm]
mode = "openai"
calibration = "temperature"
calibration_users = 1
model_role = "primary"
model = "gpt-5.6-sol"
reasoning_effort = "medium"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com"
allow_custom_base_url = false
timeout_seconds = 180.0
max_retries = 0
max_output_tokens = 2048
max_requests = 900
max_total_tokens = 6000000
journal_dir = ""

[artifacts]
retain_events = true
retain_prompts = true
checksum_manifest = true
