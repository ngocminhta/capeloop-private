schema_version = 1

[scenarios]
catalog_file = "data/scenarios/scenario-catalog-v1.json"
catalog_sha256 = "96f092856ea17ea3939a769c754f5dd46299efddc6d0304c3adbf16bddbd0286"
conversation_file = "data/scenarios/conversation-templates-v1.json"
selection_policy = "deterministic-stratified-v1"

[population]
susceptibility_policy = "orthogonal-balanced-v2"
theta_policy = "orthogonal-balanced-v2"

# Matched budget-bounded OpenRouter Experiment B pilot. Correct and incorrect
# seeds are crossed with balanced, soft, and exploratory policies. One LLM is
# evaluated at a time so six turns revisit every preference dimension while
# local references remain available without additional provider calls.

[run]
name = "experiment-b-openrouter-replication-pilot"
seed = 1729
output_root = "runs"
deterministic = false

[experiment]
kind = "closed_loop"
domains = ["travel", "writing"]
mechanisms = ["ranking", "default", "suggestion"]
response_modes = ["naturally_sampled"]
prior_strengths = [0.0]
initial_profile_conditions = ["correct", "incorrect"]
policies = ["balanced", "soft_profile_conditioned", "exploratory"]
updaters = [
  "fitted_action_aware",
  "fitted_action_unaware",
  "response_only",
  "full_context_blind",
  "provenance_discount",
  "llm_full_context",
]
users = 8
trajectories_per_cell = 1
turns = 6
bootstrap_replicates = 2000

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.75
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 4096
fit_steps = 1200
learning_rate = 0.025
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6
selection_noninferiority_margin = 0.02
net_harm_margin = 0.02
decomposition_tolerance = 1e-12

[manipulation]
planning_mode = "required"
minimum_informative_active_turns = 2
minimum_active_mechanisms = 2
minimum_decisive_active_controls = 1
minimum_informative_choice_divergence_probability = 0.02
maximum_decisive_choice_divergence_probability = 0.05
minimum_active_susceptibility_mass = 0.05
require_counter_profile_options = true
offline_response_seeds = 32

[llm]
mode = "openrouter"
calibration = "temperature"
calibration_users = 1
model_role = "replication"
model = "google/gemini-3.6-flash"
# The live transport smoke showed that unconstrained provider reasoning can
# exhaust the output budget before the required JSON object is complete.
reasoning_effort = "minimal"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api"
allow_custom_base_url = false
timeout_seconds = 180.0
# 60 calibration + 576 trajectory calls; 264 attempts remain as headroom.
max_retries = 0
max_output_tokens = 2048
max_requests = 900
max_total_tokens = 6000000
journal_dir = ""
openrouter_upstream_provider = "google-vertex/global"
openrouter_allow_fallbacks = false
openrouter_require_parameters = true
openrouter_data_collection = "deny"
openrouter_zdr = false
openrouter_http_referer = ""
openrouter_app_title = "CAPE-Loop"

[artifacts]
retain_events = true
retain_prompts = true
checksum_manifest = true
