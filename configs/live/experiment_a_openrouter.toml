schema_version = 1

[scenarios]
catalog_file = "data/scenarios/scenario-catalog-v1.json"
catalog_sha256 = "7b7144b3b3f75ac7284ab6153d1b6ce62cf293aec94004ee2cb3111bcc1f6cf1"
conversation_file = "data/scenarios/conversation-templates-v1.json"
selection_policy = "deterministic-stratified-v1"

[population]
susceptibility_policy = "orthogonal-balanced-v2"
theta_policy = "orthogonal-balanced-v2"

# Matched bounded OpenRouter Experiment A live pilot.

[run]
name = "experiment-a-openrouter-mixed-effects-pilot"
seed = 1729
output_root = "runs"
deterministic = false

[experiment]
kind = "provenance_audit"
domains = ["travel", "writing"]
mechanisms = ["balanced", "restricted", "default", "suggested"]
response_modes = ["controlled_anchor", "naturally_sampled"]
prior_strengths = [0.0, 0.7]
policies = ["balanced"]
updaters = [
  "no_update",
  "exact_action_aware",
  "fitted_action_aware",
  "fitted_action_unaware",
  "llm_full_context",
  "provenance_discount",
]
users = 4
trajectories_per_cell = 1
turns = 1
bootstrap_replicates = 0

[response_model]
beta = 1.0
decision_noise = 1.0
rank_scale = 0.35
default_scale = 0.75
suggestion_scale = 0.65
susceptibility_levels = [0.15, 0.45, 0.85]
minimum_matched_probability = 0.05

[inference]
training_interactions = 512
fit_steps = 600
learning_rate = 0.04
l2 = 0.001
calibration = "temperature"

[thresholds]
materially_wrong_mass = 0.50
laundered_confidence_gain = 0.25
shadow_equivalence_tolerance = 0.05
false_stability_tolerance = 0.02
direction_tolerance = 1e-9
ranking_tie_tolerance = 1e-6

[llm]
mode = "openrouter"
calibration = "temperature"
calibration_users = 1
model_role = "replication"
model = "google/gemini-3.6-flash"
# The live transport smoke showed that unconstrained provider reasoning can
# exhaust the output budget before the required JSON object is complete.
reasoning_effort = "minimal"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api"
allow_custom_base_url = false
timeout_seconds = 180.0
# 848 logical calls × one physical attempt; 52 attempts remain as headroom.
max_retries = 0
max_output_tokens = 2048
max_requests = 900
max_total_tokens = 6000000
journal_dir = ""
openrouter_upstream_provider = "google-vertex/global"
openrouter_allow_fallbacks = false
openrouter_require_parameters = true
openrouter_data_collection = "deny"
openrouter_zdr = false
openrouter_http_referer = ""
openrouter_app_title = "CAPE-Loop"

[artifacts]
retain_events = true
retain_prompts = true
checksum_manifest = true
